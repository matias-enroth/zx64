<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <style>
      .rom{fill:#eaf2ff;stroke:#4a78c2;stroke-width:1.2}
      .ram{fill:#f5f9ff;stroke:#4a78c2;stroke-width:1.2;stroke-dasharray:5 3}
      .z{fill:#fff4e5;stroke:#e08a1e;stroke-width:1.2}
      .c64{fill:#f4f6f8;stroke:#8a96a3;stroke-width:1.2}
      .t{fill:#1f2328}
      .b{font-weight:600}
      .a{fill:#57606a;font-size:12.5;font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
      .h{fill:#57606a;font-size:12.5}
    </style>
  </defs>
  <rect width="640" height="466" rx="10" fill="#ffffff"/>

  <text class="h" x="40" y="30">Z80</text>
  <rect class="rom" x="100" y="40" width="440" height="44"/>
  <text class="t b" x="116" y="67">The ZX81 ROM, patched</text>
  <rect class="z" x="100" y="84" width="440" height="22"/>
  <text class="t" x="116" y="100">zx128, keyboard rows, mailbox to the 8502</text>
  <rect class="z" x="100" y="106" width="440" height="22"/>
  <text class="t" x="116" y="122">zx64mon, the monitor, always there</text>
  <rect class="rom" x="100" y="128" width="440" height="88"/>
  <text class="t b" x="116" y="168">ZX81 RAM, 16K</text>
  <text class="h" x="116" y="186">BASIC: programs, variables, the display file</text>
  <rect class="ram" x="100" y="216" width="440" height="88"/>
  <text class="t b" x="116" y="265">16K more in 32K mode (F8)</text>
  <rect class="z" x="100" y="304" width="440" height="22"/>
  <text class="t" x="116" y="320">The picture as the VDC has it</text>
  <rect class="z" x="100" y="326" width="440" height="22"/>
  <text class="t" x="116" y="342">The monitor's screen</text>
  <rect class="z" x="100" y="348" width="440" height="44"/>
  <text class="t" x="116" y="375">zx128's second part: the picture's code, the panel's</text>
  <rect class="c64" x="100" y="392" width="440" height="44"/>
  <text class="t b" x="116" y="410">Shared with the 8502</text>
  <text class="h" x="116" y="428">more of the monitor and of zx128, the switching code, the MMU</text>

  <text class="a" x="40" y="45">0000</text>
  <text class="a" x="40" y="89">2000</text>
  <text class="a" x="40" y="111">3000</text>
  <text class="a" x="40" y="133">4000</text>
  <text class="a" x="40" y="221">8000</text>
  <text class="a" x="40" y="309">C000</text>
  <text class="a" x="40" y="331">C400</text>
  <text class="a" x="40" y="353">C900</text>
  <text class="a" x="40" y="397">E000</text>
  <text class="a" x="40" y="441">FFFF</text>
</svg>
